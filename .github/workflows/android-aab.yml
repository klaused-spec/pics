name: Android AAB (Play Store)

# Gera um Android App Bundle (.aab) de release ASSINADO, pronto para envio a
# Google Play Console. A assinatura usa uma keystore de upload guardada como
# GitHub Secrets (nunca commitada no repositorio).
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  -> conteudo do .jks em base64
#   ANDROID_KEYSTORE_PASSWORD-> senha da keystore
#   ANDROID_KEY_ALIAS        -> alias da chave (ex.: pics-upload)
#   ANDROID_KEY_PASSWORD     -> senha da chave

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Configure release signing
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Inject signingConfig into build.gradle
        run: node ../.github/scripts/inject-signing.js

      - name: Build signed release AAB
        run: ./gradlew bundleRelease
        working-directory: mobile/android

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pics-mobile-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/keystore.properties
