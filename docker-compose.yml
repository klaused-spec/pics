services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${SOURCE_DIR:-/mnt/hd4tb/OneDrive/Pictures/Camera Roll}:/data/source:ro
      - ${ORGANIZED_DIR:-/mnt/hd4tb/Fotos}:/data/organized
      - pics_db:/app/data
    env_file:
      - ./backend/.env
    environment:
      - SOURCE_DIR=/data/source
      - ORGANIZED_DIR=/data/organized
      - DATABASE_URL=sqlite:////app/data/pics.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pics_db:
